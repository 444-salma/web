    <!--End of JavaScript for authentication check-->
    <!-- JavaScript for make reminders visible in dashboard-->

    <script>
      async function loadReminders() {
        const remindersContainer =
          document.getElementById("remindersContainer");

        try {
          const response = await fetch(
            "https://web-2-ftdn.onrender.com/tasks",
            {
              headers: {
                Authorization: `Bearer ${localStorage.getItem("token")}`,
              },
            },
          );
          let tasks = await response.json();

          const today = new Date();
          today.setHours(0, 0, 0, 0);

          const priorityRank = {
            High: 1,
            Medium: 2,
            Low: 3,
          };

          tasks = tasks
            .filter((task) => {
              const taskDate = new Date(task.dueDate || task.date);
              taskDate.setHours(0, 0, 0, 0);

              const diffDays = (taskDate - today) / (1000 * 60 * 60 * 24);

              return diffDays >= 0 && diffDays <= 2;
            })
            .sort((a, b) => {
              const priorityDifference =
                priorityRank[a.priority] - priorityRank[b.priority];

              if (priorityDifference !== 0) {
                return priorityDifference;
              }

              return (
                new Date(a.dueDate || a.date) - new Date(b.dueDate || b.date)
              );
            });
          const upcomingDeadline = document.querySelector(
            ".stats-card:nth-child(3) p",
          );

          if (tasks.length > 0) {
            upcomingDeadline.textContent = tasks[0].title;
          } else {
            upcomingDeadline.textContent = "No deadlines";
          }

          remindersContainer.innerHTML = "";

          tasks.forEach((task) => {
            const reminder = document.createElement("div");

            reminder.className = "reminder-box";

            reminder.innerHTML = `
        <div class="reminder-left">
          <span class="reminder-tag task">
            ${task.type}
          </span>

          <div class="reminder-info">
            <strong>${task.title}</strong>
            <p>${formatReminderDate(task.dueDate || task.date)}</p>
          </div>
        </div>

        <span class="reminder-priority ${task.priority.toLowerCase()}">
          ${task.priority}
        </span>
      `;

            remindersContainer.appendChild(reminder);
          });

          if (tasks.length === 0) {
            remindersContainer.innerHTML = "<p>No upcoming reminders.</p>";
          }
        } catch (error) {
          console.log(error);
        }
      }

      loadReminders();
    </script>
    <script>
      let completedCount = 0;
      let missedCount = 0;

      async function loadDashboardData() {
        try {
          const token = localStorage.getItem("token");

          const [coursesRes, sessionsRes] = await Promise.all([
            fetch("https://web-2-ftdn.onrender.com/courses", {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            }),

            fetch("https://web-2-ftdn.onrender.com/studySchedule", {
              headers: {
                Authorization: `Bearer ${token}`,
              },
            }),
          ]);
          const courses = await coursesRes.json();
          const sessions = await sessionsRes.json();

          document.querySelector(".stats-card:nth-child(1) p").textContent =
            courses.length;
          const todayName = new Date().toLocaleDateString("en-US", {
            weekday: "short",
          });

          const todaySessions = sessions.filter(
            (session) => session.day === todayName,
          );

          document.getElementById("sessionsCount").textContent =
            todaySessions.length;

          renderSessions(todaySessions);

          updateCompletionRate(sessions);
        } catch (error) {
          console.log(error);
        }
      }

      function renderSessions(sessions) {
        const container = document.getElementById("sessionsContainer");

        container.innerHTML = "";

        if (sessions.length === 0) {
          container.innerHTML = "<p>No study sessions found.</p>";
          return;
        }

        sessions.forEach((session) => {
          const div = document.createElement("div");

          div.className = "session-box";

          div.innerHTML = `
                  <div class="session-info">
                    <strong>${session.course || "No course"}</strong>
                    <p>
                      ${session.day || ""}
                      |
                      ${session.startTime || ""} - ${session.endTime || ""}
                    </p>
                  </div>

                  <div class="session-actions">
                    <button class="session-btn"
                      onclick="updateSessionStatus('${session._id}', 'completed')">
                      Completed
                    </button>

                    <button class="missed-btn"
                      onclick="updateSessionStatus('${session._id}', 'missed')">
                      Missed
                    </button>
                  </div>
                `;

          container.appendChild(div);
        });
      }

      async function updateSessionStatus(sessionId, status) {
        try {
          const token = localStorage.getItem("token");

          await fetch(
            `https://web-2-ftdn.onrender.com/studySchedule/${sessionId}/status`,
            {
              method: "PUT",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
              },
              body: JSON.stringify({ status }),
            },
          );

          loadDashboardData();
        } catch (error) {
          console.log(error);
        }
      }

      function updateCompletionRate(sessions) {
        const completed = sessions.filter(
          (s) => s.status === "completed",
        ).length;

        const rate =
          sessions.length === 0
            ? 0
            : Math.round((completed / sessions.length) * 100);

        document.getElementById("completionRate").textContent = rate + "%";
      }

      loadDashboardData();
    </script>

    <script>
      function formatReminderDate(dateValue) {
        const taskDate = new Date(dateValue);
        taskDate.setHours(0, 0, 0, 0);

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const diffDays = Math.round((taskDate - today) / (1000 * 60 * 60 * 24));

        if (diffDays === 0) return "Today";
        if (diffDays === 1) return "Tomorrow";
        if (diffDays === 2) return "After tomorrow";

        return dateValue;
      }
    </script>
